<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GFFI – Menyambut Ramadan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Nunito:wght@300&display=swap" rel="stylesheet">

<style>
:root{
  --gold:    #c9a84c;
  --gold-lt: #e8c97a;
  --glow:    #1fd97a;
  --cream:   #f2e8d4;
  --bg:      #010c06;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;height:100%;
  background:#000;
  display:flex;justify-content:center;align-items:center;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── WRAPPER ── */
#app{
  position:relative;
  width:100vw;height:100dvh;
  overflow:hidden;
  display:flex;flex-direction:column;align-items:center;
  /* Pure CSS gradient bg — zero JS */
  background:
    radial-gradient(ellipse 70% 50% at 72% 20%, rgba(25,140,80,.09) 0%, transparent 60%),
    radial-gradient(ellipse 90% 60% at 50% 100%, rgba(1,18,8,.9) 0%, transparent 70%),
    linear-gradient(170deg, #010e06 0%, #020f07 45%, #010b05 100%);
}

@media(min-width:480px){
  #app{
    width:390px;height:min(844px,100dvh);
    border-radius:40px;
    box-shadow:0 0 0 1px rgba(255,255,255,.05),0 40px 120px rgba(0,0,0,.85);
  }
}

/* ══ STARS — pure CSS, will-change:opacity only ══ */
#stars{
  position:absolute;inset:0;
  pointer-events:none;z-index:1;
}
.s{
  position:absolute;border-radius:50%;
  background:#ffffd4;
  will-change:opacity;
  animation:twinkle var(--d,3s) var(--delay,0s) ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:var(--lo,.1)}to{opacity:var(--hi,.9)}}

/* ══ MOON — CSS only ══ */
#moon-wrap{
  position:absolute;
  top:clamp(44px,10vh,80px);
  right:clamp(44px,18vw,90px);
  z-index:2;
  animation:moon-bob 5s ease-in-out infinite;
  will-change:transform;
}
@keyframes moon-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

#moon{
  position:relative;
  width:clamp(52px,13vw,68px);
  height:clamp(52px,13vw,68px);
}
#moon::before{/* moon body */
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 38% 38%, #dff5b0, #b8e880);
  box-shadow:0 0 28px rgba(160,240,120,.3),0 0 60px rgba(160,240,120,.1);
}
#moon::after{/* crescent shadow */
  content:'';
  position:absolute;
  top:-4%;left:22%;
  width:90%;height:90%;
  border-radius:50%;
  background:var(--bg);
  box-shadow:inset 0 0 12px rgba(0,0,0,.4);
}
/* star near moon */
#moon-star{
  position:absolute;
  top:-16%;left:-22%;
  width:clamp(10px,2.4vw,14px);
  height:clamp(10px,2.4vw,14px);
  color:var(--gold-lt);
  filter:drop-shadow(0 0 5px var(--gold));
}
/* glow ring */
#moon-glow{
  position:absolute;
  inset:-40%;border-radius:50%;
  background:radial-gradient(circle, rgba(160,255,140,.06) 0%, transparent 70%);
  pointer-events:none;
  animation:glow-pulse 4s ease-in-out infinite;
  will-change:opacity;
}
@keyframes glow-pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ══ LANTERNS ══ */
#lanterns{
  position:absolute;top:0;left:0;right:0;
  height:clamp(90px,18vh,130px);
  z-index:3;pointer-events:none;
}
.lw{/* lantern wrapper */
  position:absolute;top:0;
  display:flex;flex-direction:column;align-items:center;
  transform-origin:top center;
  will-change:transform;
  animation:swing var(--sw,4s) var(--sd,0s) ease-in-out infinite alternate;
}
@keyframes swing{from{transform:rotate(var(--ra,-7deg))}to{transform:rotate(var(--rb,7deg))}}

.rope{width:1px;background:linear-gradient(to bottom,rgba(201,168,76,.45),rgba(201,168,76,.1));}
.lb{/* lantern body */
  position:relative;
  border-radius:50% 50% 40% 40%;
  overflow:hidden;
}
.lb::after{/* sheen */
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,rgba(255,255,255,.14) 0%,transparent 55%,rgba(0,0,0,.25) 100%);
}
.lc{/* cap/base */
  border-radius:2px;
  background:var(--gold);
}
.ltassel{display:flex;gap:2px;margin-top:1px;}
.ltassel span{
  width:1px;background:rgba(201,168,76,.55);
  animation:tassel var(--td,1s) ease-in-out infinite alternate;
}
@keyframes tassel{from{transform:skewX(-6deg)}to{transform:skewX(6deg)}}

/* ══ SHOOTING STAR ══ */
.shoot{
  position:absolute;z-index:2;
  height:1.5px;border-radius:999px;
  background:linear-gradient(90deg,transparent,rgba(255,255,220,.85));
  pointer-events:none;opacity:0;
  will-change:transform,opacity;
  animation:shoot linear infinite;
}
@keyframes shoot{
  0%  {opacity:0;transform:var(--base) translateX(0)}
  6%  {opacity:.9}
  30% {opacity:0;transform:var(--base) translateX(160px)}
  100%{opacity:0;transform:var(--base) translateX(160px)}
}

/* ══ FIREFLIES — only 6, CSS ══ */
.fly{
  position:absolute;z-index:4;
  border-radius:50%;pointer-events:none;
  will-change:transform,opacity;
  animation:ff-move var(--fm,9s) var(--fd,0s) ease-in-out infinite,
            ff-blink var(--fb,4s) var(--fd,0s) ease-in-out infinite;
}
@keyframes ff-move{
  0%,100%{transform:translate(0,0)}
  33%    {transform:translate(var(--mx,10px),var(--my,-20px))}
  66%    {transform:translate(var(--mx2,-8px),var(--my2,-32px))}
}
@keyframes ff-blink{0%,100%{opacity:0}40%,60%{opacity:1}}

/* ══ MOSQUE SVG ══ */
#mosque{
  position:absolute;bottom:0;left:0;right:0;
  z-index:5;pointer-events:none;
}
#mosque svg{width:100%;display:block;}

/* ══ FADE OVERLAYS ══ */
#fade-top{
  position:absolute;top:0;left:0;right:0;height:22%;
  background:linear-gradient(to bottom,rgba(1,10,5,.88),transparent);
  z-index:6;pointer-events:none;
}
#fade-bot{
  position:absolute;bottom:0;left:0;right:0;height:38%;
  background:linear-gradient(to top,rgba(1,10,5,1) 0%,rgba(1,10,5,.6) 50%,transparent 100%);
  z-index:6;pointer-events:none;
}

/* ══ CONTENT ══ */
#content{
  position:relative;z-index:10;
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;
  padding:clamp(22px,5.5vh,48px) 28px clamp(32px,6vh,52px);
}

/* TOP */
#brand{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  animation:up .9s .1s both;
}
#b-label{
  font-family:'Nunito',sans-serif;font-weight:300;
  font-size:clamp(9px,2.4vw,11px);letter-spacing:7px;text-indent:7px;
  color:rgba(201,168,76,.45);
}
#b-name{
  font-family:'Cormorant Garamond',serif;font-weight:600;
  font-size:clamp(20px,5.5vw,26px);letter-spacing:5px;
  color:var(--gold);text-shadow:0 0 20px rgba(201,168,76,.3);
}
.rule{display:flex;align-items:center;gap:8px;}
.rl{width:28px;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,.45));}
.rl.r{background:linear-gradient(90deg,rgba(201,168,76,.45),transparent);}
.gem{width:4px;height:4px;transform:rotate(45deg);background:var(--gold-lt);box-shadow:0 0 5px var(--gold);}

/* MIDDLE */
#hero{
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(8px,2.2vh,18px);
  flex:1;justify-content:center;
  padding-bottom:clamp(16px,4vh,40px);
}
#arabic{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
  font-size:clamp(16px,4.5vw,21px);letter-spacing:3px;
  color:var(--gold-lt);text-shadow:0 0 22px rgba(232,201,122,.4);
  animation:up .9s .5s both;
}
.orn{display:flex;align-items:center;gap:10px;animation:up .7s .65s both;}
.orn .rl{width:36px;}
.orn-d{
  width:7px;height:7px;transform:rotate(45deg);
  border:1px solid rgba(201,168,76,.7);
  box-shadow:0 0 7px rgba(201,168,76,.35);
  position:relative;
}
.orn-d::after{content:'';position:absolute;inset:2px;background:var(--gold-lt);}
#yr{
  font-family:'Nunito',sans-serif;font-weight:300;
  font-size:clamp(10px,2.7vw,12px);letter-spacing:6px;text-indent:6px;
  color:var(--glow);text-shadow:0 0 18px rgba(31,217,122,.5);
  animation:up .8s .35s both;
}
#title{
  font-family:'Cormorant Garamond',serif;font-weight:600;
  font-size:clamp(38px,11vw,56px);line-height:1.08;
  text-align:center;color:var(--cream);
  text-shadow:0 2px 30px rgba(31,217,122,.07);
  animation:up 1s .2s both;
}
#sub{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
  font-size:clamp(13px,3.4vw,17px);letter-spacing:1.5px;
  color:rgba(242,232,212,.48);text-align:center;line-height:1.8;
  animation:up .8s .8s both;
}

/* BOTTOM LOADER */
#loader{
  width:100%;max-width:280px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  animation:up .8s 1.1s both;
}

/* Pill */
#pill{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(201,168,76,.14);
  border-radius:999px;padding:5px 15px;
}
.ring{
  width:7px;height:7px;border-radius:50%;
  background:var(--glow);
  box-shadow:0 0 0 0 rgba(31,217,122,.4);
  animation:ring-pulse 2.2s ease-out infinite;
}
@keyframes ring-pulse{
  0%  {box-shadow:0 0 0 0 rgba(31,217,122,.5)}
  70% {box-shadow:0 0 0 6px rgba(31,217,122,0)}
  100%{box-shadow:0 0 0 0 rgba(31,217,122,0)}
}
#s-txt{
  font-family:'Nunito',sans-serif;font-weight:300;
  font-size:clamp(10px,2.6vw,12px);letter-spacing:3px;text-indent:3px;
  color:rgba(242,232,212,.5);transition:opacity .35s;
}

/* Bar */
#bar-track{
  width:100%;height:2px;
  background:rgba(255,255,255,.07);border-radius:999px;
  position:relative;overflow:visible;
}
#bar-fill{
  height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,var(--gold),var(--glow),var(--gold-lt));
  box-shadow:0 0 8px rgba(31,217,122,.45);
  transition:width .5s cubic-bezier(.4,0,.2,1);
  position:relative;
}
#bar-tip{
  position:absolute;right:-3px;top:50%;transform:translateY(-50%);
  width:7px;height:7px;border-radius:50%;
  background:#fff;box-shadow:0 0 0 2px rgba(31,217,122,.3),0 0 10px var(--glow);
  opacity:0;transition:opacity .4s;
}

/* Segments + pct */
#seg-row{display:flex;align-items:center;gap:5px;width:100%;}
.seg{flex:1;height:2px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden;}
.seg::after{content:'';display:block;height:100%;width:0;background:var(--gold);transition:width .5s ease;}
.seg.done::after{width:100%;background:var(--gold);}
.seg.now::after{width:60%;background:var(--glow);animation:seg-now 1s ease infinite alternate;}
@keyframes seg-now{from{width:40%}to{width:80%}}

#meta-row{
  width:100%;display:flex;justify-content:space-between;align-items:center;
}
#pct{
  font-family:'Cormorant Garamond',serif;font-weight:300;
  font-size:clamp(12px,3.2vw,14px);letter-spacing:1px;
  color:var(--glow);text-shadow:0 0 12px rgba(31,217,122,.45);
}
#rem{
  font-family:'Nunito',sans-serif;font-weight:300;
  font-size:clamp(9px,2vw,10px);letter-spacing:2px;
  color:rgba(242,232,212,.2);
}

/* FLASH */
#flash{
  position:absolute;inset:0;z-index:99;
  background:radial-gradient(ellipse at 50% 40%,#b8f0d0,#fff);
  opacity:0;pointer-events:none;
}

@keyframes up{
  from{opacity:0;transform:translateY(16px)}
  to  {opacity:1;transform:translateY(0)}
}
</style>
</head>
<body>

<script>
if(sessionStorage.getItem("gffi_loaded")){
  location.replace("https://ramadhan-berandagffi.netlify.app/");
}
</script>

<div id="app">

  <!-- STARS — injected as tiny divs, CSS animation only -->

  <div id="moon-wrap">

    <div id="moon">
      <!-- SVG star beside moon -->
      <svg id="moon-star" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <polygon fill="currentColor"

  <!-- LANTERNS -->
  <div id="lanterns"></div>

  <div class="shoot" style="width:56px;top:16%;left:8%;--base:rotate(-20deg);animation-duration:7s;animation-delay:1.5s;"></div>
  <div class="shoot" style="width:48px;top:24%;left:52%;--base:rotate(-16deg);animation-duration:9s;animation-delay:5.5s;"></div>

  <div class="fly" style="left:10%;top:44%;width:2.8px;height:2.8px;background:rgba(31,217,122,.8);box-shadow:0 0 7px rgba(31,217,122,.8);--fm:9s;--fd:0s;--mx:10px;--my:-20px;--mx2:-6px;--my2:-34px;--fb:4.5s;"></div>
  <div class="fly" style="left:24%;top:60%;width:2.4px;height:2.4px;background:rgba(201,168,76,.9);box-shadow:0 0 6px rgba(201,168,76,.8);--fm:12s;--fd:2s;--mx:12px;--my:-18px;--mx2:-8px;--my2:-28px;--fb:5s;"></div>
  <div class="fly" style="left:66%;top:43%;width:3px;height:3px;background:rgba(31,217,122,.7);box-shadow:0 0 8px rgba(31,217,122,.7);--fm:8s;--fd:3.5s;--mx:8px;--my:-24px;--mx2:-10px;--my2:-38px;--fb:4s;"></div>
  <div class="fly" style="left:80%;top:64%;width:2.4px;height:2.4px;background:rgba(201,168,76,.8);box-shadow:0 0 6px rgba(201,168,76,.7);--fm:11s;--fd:1s;--mx:-9px;--my:-20px;--mx2:11px;--my2:-30px;--fb:5.5s;"></div>
  <div class="fly" style="left:44%;top:38%;width:2px;height:2px;background:rgba(255,255,180,.55);box-shadow:0 0 5px rgba(255,255,180,.5);--fm:10s;--fd:4s;--mx:7px;--my:-26px;--mx2:-5px;--my2:-18px;--fb:5s;"></div>
  <div class="fly" style="left:56%;top:72%;width:2.6px;height:2.6px;background:rgba(201,168,76,.75);box-shadow:0 0 7px rgba(201,168,76,.6);--fm:7.5s;--fd:5s;--mx:-11px;--my:-22px;--mx2:8px;--my2:-14px;--fb:3.8s;"></div>

  <!-- MOSQUE -->
  <div id="mosque">
    <svg viewBox="0 0 390 220" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet">
      <defs>
        <linearGradient id="mg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#071a0e"/><stop offset="100%" stop-color="#010c06"/>
        </linearGradient>
      </defs>
      <!-- Left minaret -->
      <rect x="28" y="28" width="19" height="148" fill="url(#mg)"/>
      <path d="M28,28 Q37.5,8 47,28Z" fill="#0a1f12"/>
      <rect x="24" y="60"  width="27" height="4" rx="1" fill="#06180d"/>

      <circle cx="37.5" cy="22" r="5.5" fill="#c9a84c" opacity=".85"/>

      <!-- Right minaret -->
      <rect x="343" y="28" width="19" height="148" fill="url(#mg)"/>

      <path d="M347,138 Q352.5,128 358,138 L358,158 L347,158Z" fill="#041009"/>
      <circle cx="352.5" cy="22" r="5.5" fill="#c9a84c" opacity=".85"/>
      <circle cx="356"   cy="21" r="5"   fill="#071a0e"/>

      <rect x="47" y="108" width="68" height="112" fill="url(#mg)"/>

      <path d="M66,148 Q74,136 82,148 L82,170 L66,170Z" fill="#041009"/>
      <rect x="274" y="108" width="68" height="112" fill="url(#mg)"/>
      <path d="M274,108 Q308,74 342,108Z" fill="#0a1f12"/>
      <path d="M306,148 Q314,136 322,148 L322,170 L306,170Z" fill="#041009"/>
      <!-- Main body -->
      <rect x="115" y="128" width="160" height="92" fill="url(#mg)"/>

      <rect x="0" y="210" width="390" height="10" fill="#010c06"/>
    </svg>
  </div>

  <!-- Fade overlays -->
  <div id="fade-top"></div>
  <div id="fade-bot"></div>

  <!-- CONTENT -->
  <div id="content">
    <div id="brand">
      <div id="b-label">BERANDA</div>

      </div>

  <div id="flash"></div>
</div>

<script>
/* ── STARS via CSS (no canvas, no rAF for stars) ── */
const starCont = document.getElementById("stars");
const frag = document.createDocumentFragment();
for(let i=0;i<90;i++){
  const d = document.createElement("div");
  const r = Math.random()*1.3+.2;
  const lo = (.05+Math.random()*.15).toFixed(2);
  const hi = (.5+Math.random()*.5).toFixed(2);
  d.className = "s";
  d.style.cssText = `
    left:${Math.random()*100}%;
    top:${Math.random()*64}%;
    width:${r}px;height:${r}px;
    --lo:${lo};--hi:${hi};
    --d:${(2.5+Math.random()*4).toFixed(1)}s;
    --delay:${(Math.random()*5).toFixed(1)}s;
  `;
  frag.appendChild(d);
}
starCont.appendChild(frag);

/* ── LANTERNS via JS (lightweight, CSS animation) ── */
const lCont = document.getElementById("lanterns");
const LD = [
  {l:"9%",  rope:50, bw:12,bh:26, col:"#c9a84c", sw:"4s",  sd:"0s",   ra:"-7deg", rb:"7deg"},
  {l:"27%", rope:66, bw:10,bh:22, col:"#1fd97a", sw:"5.2s",sd:".5s",  ra:"6deg",  rb:"-8deg"},
  {l:"50%", rope:44, bw:14,bh:30, col:"#c9a84c", sw:"3.8s",sd:"1.2s", ra:"-5deg", rb:"9deg"},
  {l:"72%", rope:62, bw:10,bh:22, col:"#1fd97a", sw:"4.8s",sd:".8s",  ra:"7deg",  rb:"-6deg"},
  {l:"89%", rope:52, bw:12,bh:26, col:"#c9a84c", sw:"4.2s",sd:"1.7s", ra:"-8deg", rb:"5deg"},
];
LD.forEach(d=>{
  const glowC = d.col==="#c9a84c" ? "rgba(201,168,76,.15)" : "rgba(31,217,122,.13)";
  const w = document.createElement("div");
  w.className = "lw";
  w.style.cssText = `left:${d.l};--sw:${d.sw};--sd:${d.sd};--ra:${d.ra};--rb:${d.rb}`;
  w.innerHTML = `
    <div class="rope" style="height:${d.rope}px"></div>
    <div style="position:relative">
      <div class="lc" style="width:${d.bw+4}px;height:3px"></div>
      <div class="lb" style="width:${d.bw}px;height:${d.bh}px;background:${d.col}"></div>
      <div class="lc" style="width:${d.bw+4}px;height:3px"></div>
      <div class="ltassel">
        <span style="height:${Math.round(d.bh*.32)}px;--td:${.8+Math.random()*.3}s"></span>
        <span style="height:${Math.round(d.bh*.38)}px;--td:${.9+Math.random()*.35}s"></span>
        <span style="height:${Math.round(d.bh*.3)}px;--td:${.75+Math.random()*.3}s"></span>
      </div>
      <div style="position:absolute;top:-30%;left:50%;transform:translateX(-50%);
                  width:${d.bw*3}px;height:${d.bw*3}px;border-radius:50%;
                  background:radial-gradient(circle,${glowC},transparent 70%);
                  pointer-events:none;filter:blur(6px)">
      </div>
    </div>`;
  lCont.appendChild(w);
});

/* ── PROGRESS (minimal rAF) ── */
const DURATION = 14000;
const t0 = performance.now();
const barFill = document.getElementById("bar-fill");
const barTip  = document.getElementById("bar-tip");
const pctEl   = document.getElementById("pct");
const remEl   = document.getElementById("rem");
const sTxtEl  = document.getElementById("s-txt");
const segs    = [0,1,2,3,4].map(i=>document.getElementById("sg"+i));
const flash   = document.getElementById("flash");

const LABELS = ["Memuat","Menyiapkan","Hampir Siap"];
let lastLbl=-1, lastSeg=-1;

setTimeout(()=>{ barTip.style.opacity="1"; },600);

function tick(ts){
  const el = ts - t0;
  const p  = Math.min(1, el/DURATION);
  const pN = Math.round(p*100);
  const r  = Math.max(0,Math.ceil((DURATION-el)/1000));

  barFill.style.width = pN+"%";
  pctEl.textContent   = pN+"%";
  remEl.textContent   = r>0 ? r+"s" : "—";

  // Segments
  const cs = Math.min(4, Math.floor(p*5));
  if(cs!==lastSeg){
    lastSeg=cs;
    segs.forEach((s,i)=>{
      s.className = "seg"+(i<cs?" done":i===cs?" now":"");
    });
  }

  // Labels
  const cl = p>=.8?2:p>=.48?1:0;
  if(cl!==lastLbl){
    lastLbl=cl;
    sTxtEl.style.opacity="0";
    setTimeout(()=>{ sTxtEl.textContent=LABELS[cl]; sTxtEl.style.opacity="1"; },300);
  }

  if(p<1) requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ── REDIRECT ── */
setTimeout(()=>{
  sTxtEl.style.opacity="0";
  setTimeout(()=>{ sTxtEl.textContent="Masuk"; sTxtEl.style.opacity="1"; },280);
  barFill.style.width="100%";
  pctEl.textContent="100%";
  segs.forEach(s=>{ s.className="seg done"; });

  setTimeout(()=>{
    flash.style.transition="opacity .4s ease";
    flash.style.opacity="1";
    setTimeout(()=>{
      sessionStorage.setItem("gffi_loaded","true");
      location.replace("https://ramadhan-berandagffi.netlify.app/");
    },420);
  },300);
},DURATION+300);
</script>
