<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GFFI – Menyambut Ramadan</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
}
#phone{
  width:100%;
  max-width:430px;
  aspect-ratio:9/16;
  position:relative;
  overflow:hidden;
  background:black;
}
canvas{position:absolute;inset:0}
#loader{
  position:absolute;
  bottom:64px;
  width:100%;
  text-align:center;
  z-index:10;
}
#status{
  font-size:clamp(14px,4vw,22px);
  letter-spacing:4px;
  margin-bottom:14px;
}
#barBox{
  width:78%;
  max-width:360px;
  height:14px;
  margin:auto;
  overflow:hidden;
  border-radius:10px;
}
#bar{
  height:100%;
  width:0%;
  border-radius:10px;
}
#flash{
  position:absolute;
  inset:0;
  background:#fff;
  opacity:0;
  pointer-events:none;
  z-index:99;
}
</style>
</head>

<body>

<script>
if(sessionStorage.getItem("gffi_loaded")){
  location.replace("https://berandaramadhangffi.netlify.app/");
}
</script>

<div id="phone">
  <canvas id="c"></canvas>
  <div id="loader">
    <div id="status">MENYAMBUT RAMADAN</div>
    <div id="barBox"><div id="bar"></div></div>
  </div>
  <div id="flash"></div>
</div>

<script>
const phone=document.getElementById("phone");
const c=document.getElementById("c");
const ctx=c.getContext("2d");
const status=document.getElementById("status");
const bar=document.getElementById("bar");
const barBox=document.getElementById("barBox");
const flash=document.getElementById("flash");

function resize(){
  c.width=phone.clientWidth;
  c.height=phone.clientHeight;
}
resize(); addEventListener("resize",resize);

const SCALE=Math.min(c.width,c.height)/800;

/* ===== THEME RAMADAN ===== */
const theme={
  bg1:"#073c2a",
  bg2:"#010b08",
  glow:"#00ff99",
  accent:"#eaffd6",
  stars:260
};

phone.style.background=`radial-gradient(circle at top,${theme.bg1},${theme.bg2})`;
loader.style.color=theme.accent;
loader.style.textShadow=`0 0 14px ${theme.glow}`;
barBox.style.border=`1px solid ${theme.glow}`;
bar.style.background=`linear-gradient(90deg,${theme.glow},#ffd700,${theme.glow})`;

const texts=[
  "RAMADAN 1446 H",
  "SELAMAT MENUNAIKAN",
  "IBADAH PUASA",
  "GFFI"
];

/* ===== STARS ===== */
const stars=[];
for(let i=0;i<theme.stars;i++){
  stars.push({
    x:Math.random()*c.width,
    y:Math.random()*c.height,
    r:Math.random()*1.6+.5,
    a:Math.random()*6
  });
}

/* ===== MOON ===== */
const moon={
  x:c.width*0.72,
  y:c.height*0.22,
  r:50*SCALE,
  a:0
};

/* ===== MOON PARTICLES ===== */
const moonParticles=[];
for(let i=0;i<48;i++){
  moonParticles.push({
    a:Math.random()*Math.PI*2,
    d:Math.random()*30+moon.r+6,
    s:Math.random()*.004+.002
  });
}

/* ===== LAMPS ===== */
const lamps=[];
for(let i=0;i<6;i++){
  lamps.push({
    x:c.width*(i+1)/7,
    y:90+Math.random()*40,
    a:Math.random()*6
  });
}

/* ===== TEXT PARTICLES ===== */
let textParticles=[],ti=0;
function makeText(t){
  const o=document.createElement("canvas").getContext("2d");
  o.canvas.width=c.width;
  o.canvas.height=c.height;

  let fs=90*SCALE;
  if(t.length>14) fs=64*SCALE;

  o.font=`bold ${fs}px Arial`;
  o.textAlign="center";
  o.textBaseline="middle";
  o.fillStyle=theme.accent;

  const lines=[t];
  const sy=c.height/2;

  lines.forEach((v,i)=>{
    o.fillText(v,c.width/2,sy+i*fs*1.2);
  });

  const d=o.getImageData(0,0,c.width,c.height).data;
  textParticles=[];
  for(let y=0;y<c.height;y+=4)
    for(let x=0;x<c.width;x+=4)
      if(d[(y*c.width+x)*4]>200)
        textParticles.push({
          x:Math.random()*c.width,
          y:Math.random()*c.height,
          tx:x,ty:y,
          vx:(Math.random()-.5)*6,
          vy:(Math.random()-.5)*6,
          p:"fly"
        });
}

/* ===== MOSQUE ===== */
function drawMosque(){
  ctx.fillStyle="rgba(0,0,0,.75)";
  const h=c.height;
  ctx.beginPath();
  ctx.moveTo(0,h);
  ctx.lineTo(0,h-100);
  for(let i=0;i<7;i++){
    ctx.quadraticCurveTo(
      c.width*(i*2+1)/14,
      h-170-(i%2)*30,
      c.width*(i+1)/7,
      h-100
    );
  }
  ctx.lineTo(c.width,h);
  ctx.closePath();
  ctx.fill();
}

/* ===== DRAW ===== */
function draw(){
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.fillRect(0,0,c.width,c.height);

  stars.forEach(s=>{
    s.a+=.01;
    ctx.fillStyle=`rgba(255,255,200,${.4+Math.sin(s.a)*.6})`;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });

  /* MOON */
  moon.a+=.002;
  ctx.save();
  ctx.translate(moon.x,moon.y);
  ctx.rotate(Math.sin(moon.a)*.05);
  ctx.fillStyle=theme.glow;
  ctx.beginPath();
  ctx.arc(0,0,moon.r,0,Math.PI*2);
  ctx.fill();
  ctx.globalCompositeOperation="destination-out";
  ctx.beginPath();
  ctx.arc(moon.r*.45,0,moon.r,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
  ctx.globalCompositeOperation="source-over";

  moonParticles.forEach(p=>{
    p.a+=p.s;
    ctx.globalAlpha=.6;
    ctx.fillStyle=theme.glow;
    ctx.beginPath();
    ctx.arc(
      moon.x+Math.cos(p.a)*p.d,
      moon.y+Math.sin(p.a)*p.d,
      2.2*SCALE,
      0,Math.PI*2
    );
    ctx.fill();
  });
  ctx.globalAlpha=1;

  lamps.forEach(l=>{
    l.a+=.02;
    ctx.strokeStyle=theme.accent;
    ctx.beginPath();
    ctx.moveTo(l.x,0);
    ctx.lineTo(l.x+Math.sin(l.a)*6,l.y);
    ctx.stroke();
    ctx.fillStyle=theme.glow;
    ctx.beginPath();
    ctx.arc(l.x+Math.sin(l.a)*6,l.y+10,6,0,Math.PI*2);
    ctx.fill();
  });

  textParticles.forEach(p=>{
    if(p.p==="fly"){
      p.x+=p.vx;p.y+=p.vy;
      p.vx*=.92;p.vy*=.92;
      if(Math.abs(p.vx)+Math.abs(p.vy)<.3)p.p="lock";
    }
    if(p.p==="lock"){
      p.x+=(p.tx-p.x)*.1;
      p.y+=(p.ty-p.y)*.1;
    }
    ctx.fillStyle=theme.accent;
    ctx.beginPath();
    ctx.arc(p.x,p.y,2.6*SCALE,0,Math.PI*2);
    ctx.fill();
  });

  drawMosque();
  requestAnimationFrame(draw);
}
draw();

/* ===== LOADING ===== */
const D=14000,start=performance.now();
function load(t){
  bar.style.width=Math.min(100,(t-start)/D*100)+"%";
  requestAnimationFrame(load);
}
requestAnimationFrame(load);

/* ===== TEXT SEQUENCE ===== */
texts.forEach((_,i)=>{
  setTimeout(()=>{
    textParticles.forEach(p=>p.p="fly");
    setTimeout(()=>makeText(texts[ti++%texts.length]),600);
  },1200+i*2600);
});

/* ===== REDIRECT ===== */
setTimeout(()=>{
  status.innerText="MASUK";
  flash.style.transition="opacity .25s";
  flash.style.opacity=1;
  setTimeout(()=>{
    sessionStorage.setItem("gffi_loaded","true");
    location.replace("https://berandaramadhangffi.netlify.app/");
  },300);
},D+300);
</script>

</body>
</html>
