<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>GFFI Guess</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#000;
  color:#fff;
  overflow:hidden;
}

/* FIRE */
#fire{
  position:fixed;
  inset:0;
  z-index:0;
}

/* OVERLAY START */
#overlay{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at top,#ff5500,#000);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:5;
}
#panel{
  background:#111;
  padding:24px;
  border-radius:14px;
  width:85%;
  max-width:320px;
  text-align:center;
}
input,button{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  font-size:16px;
}
button{
  margin-top:12px;
  font-weight:bold;
  cursor:pointer;
}

/* UI */
#ui{
  position:relative;
  z-index:2;
  padding:10px;
  display:flex;
  justify-content:space-between;
}

/* BOARD */
#board{
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  padding:12px;
}
.cell{
  aspect-ratio:1/1;
  background:#111;
  border-radius:10px;
  font-size:26px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.cell span{opacity:0;transition:.2s}
.cell.open span{opacity:1}
.cell.open{background:#222}

/* SHAKE */
.shake{animation:shake .15s infinite}
@keyframes shake{
  0%{transform:translate(0,0)}
  25%{transform:translate(5px,0)}
  50%{transform:translate(-5px,0)}
  75%{transform:translate(0,5px)}
  100%{transform:translate(0,0)}
}

/* CINEMATIC END */
#endScreen{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:6;
  opacity:0;
  pointer-events:none;
  transition:.6s;
}
#endScreen.show{
  opacity:1;
  pointer-events:auto;
}
#endBox{
  text-align:center;
  animation:zoomIn .8s ease;
}
#endTitle{
  font-size:42px;
  font-weight:bold;
  text-shadow:0 0 30px currentColor;
}
#endScore{
  margin-top:10px;
  font-size:20px;
  opacity:.8;
}
.flash{
  animation:flash .4s;
}
@keyframes zoomIn{
  from{transform:scale(.3);opacity:0}
  to{transform:scale(1);opacity:1}
}
@keyframes flash{
  from{background:#fff}
  to{background:rgba(0,0,0,.85)}
}
</style>
</head>
<body>

<canvas id="fire"></canvas>

<!-- START SCREEN -->
<div id="overlay">
  <div id="panel">
    <h2>🔥 GFFI GUESS 🔥</h2>
    <input id="nameInput" placeholder="Nama pemain">
    <button onclick="startGame()">MULAI</button>
  </div>
</div>

<!-- UI -->
<div id="ui">
  <div>👤 <span id="playerName">-</span></div>
  <div>❤️ <span id="life">2</span></div>
  <div>🔥 <span id="score">0</span></div>
</div>

<div id="board"></div>

<!-- END CINEMATIC -->
<div id="endScreen">
  <div id="endBox">
    <div id="endTitle"></div>
    <div id="endScore"></div>
  </div>
</div>

<script>
/* ===== THEME ===== */
const themes=[
  {bg:"#000", panel:"#ff5500", hue:20},
  {bg:"#001a2e", panel:"#00cfff", hue:190},
  {bg:"#0b0014", panel:"#ff00ff", hue:300},
  {bg:"#001f2f", panel:"#7ddcff", hue:210},
  {bg:"#001b10", panel:"#3cff87", hue:120}
];
let currentTheme=themes[0];

/* ===== GAME ===== */
const emojis=["🐋","🐳","🐟","🐠","🐡","🦐","🦞","🦀","🦑","🐙","🐧","🦭","🦈","🐬"];
let bombs=[],life=2,score=0,opened=0,started=false,gameEnd=false;

const board=document.getElementById("board");
const overlay=document.getElementById("overlay");
const lifeUI=document.getElementById("life");
const scoreUI=document.getElementById("score");
const nameUI=document.getElementById("playerName");
const panel=document.getElementById("panel");

/* ===== START ===== */
function startGame(){
  nameUI.textContent=document.getElementById("nameInput").value||"Player";

  currentTheme=themes[Math.random()*themes.length|0];
  document.body.style.background=currentTheme.bg;
  panel.style.boxShadow=`0 0 40px ${currentTheme.panel}`;

  overlay.style.display="none";
  started=true;
  resetGame();
}

/* ===== RESET ===== */
function resetGame(){
  board.innerHTML="";
  bombs=[];life=2;score=0;opened=0;gameEnd=false;
  document.getElementById("endScreen").classList.remove("show");

  while(bombs.length<3){
    let r=Math.random()*25|0;
    if(!bombs.includes(r))bombs.push(r);
  }

  for(let i=0;i<25;i++){
    const c=document.createElement("div");
    c.className="cell";
    const s=document.createElement("span");
    s.textContent=emojis[Math.random()*emojis.length|0];
    c.appendChild(s);
    c.onclick=()=>clickCell(c,i);
    board.appendChild(c);
  }
  updateUI();
}

/* ===== CLICK ===== */
function clickCell(c,i){
  if(!started||gameEnd||c.classList.contains("open"))return;
  c.classList.add("open");

  if(bombs.includes(i)){
    c.firstChild.textContent="💣";
    life--;
    boom();
    if(life<=0) endGame(false);
  }else{
    score+=10;
    opened++;
    if(opened===22) endGame(true);
  }
  updateUI();
}

function updateUI(){
  lifeUI.textContent=life;
  scoreUI.textContent=score;
}

/* ===== END ===== */
const endScreen=document.getElementById("endScreen");
const endTitle=document.getElementById("endTitle");
const endScore=document.getElementById("endScore");

function endGame(win){
  gameEnd=true;
  boom();

  if(win){
    endScreen.classList.add("flash");
    endTitle.style.color="gold";
    endTitle.textContent="🔥 YOU WIN 🔥";
  }else{
    endTitle.style.color="red";
    endTitle.textContent="💀 GAME OVER";
  }
  endScore.textContent="Skor: "+score;

  setTimeout(()=>endScreen.classList.add("show"),300);
}

function boom(){
  document.body.classList.add("shake");
  setTimeout(()=>document.body.classList.remove("shake"),300);
}

/* ===== FIRE ===== */
const canvas=document.getElementById("fire");
const ctx=canvas.getContext("2d");
let w,h,fire=[];
function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}
resize();onresize=resize;

function drawFire(){
  ctx.clearRect(0,0,w,h);
  fire.push({
    x:Math.random()*w,
    y:h,
    r:Math.random()*3+2,
    v:Math.random()*1.5+1,
    a:1,
    h:currentTheme.hue+Math.random()*30
  });
  fire.forEach(p=>{
    p.y-=p.v; p.a-=0.02;
    ctx.beginPath();
    ctx.fillStyle=`hsla(${p.h},100%,60%,${p.a})`;
    ctx.shadowBlur=20;
    ctx.shadowColor=ctx.fillStyle;
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  });
  fire=fire.filter(p=>p.a>0);
  requestAnimationFrame(drawFire);
}
drawFire();
</script>

</body>
</html>
