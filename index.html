<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>SnakeGFFI</title>

<!-- Font Gaming -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  font-family:Orbitron, Arial;
}

#title{
  position:absolute;
  top:8px;
  font-size:22px;
  color:#0f0;
  text-shadow:0 0 8px #0f0, 0 0 16px #0f0;
}

#ui{
  position:absolute;
  top:42px;
  color:#0f0;
  font-size:14px;
}

canvas{
  background:#050505;
  box-shadow:0 0 18px #0f0;
}

.controls{
  position:absolute;
  bottom:15px;
  display:grid;
  grid-template-columns:60px 60px 60px;
  grid-template-rows:60px 60px;
  gap:6px;
}
.controls button{
  background:#111;
  border:2px solid #0f0;
  color:#0f0;
  font-size:22px;
  border-radius:10px;
  box-shadow:0 0 8px #0f0;
}
</style>
</head>
<body>

<div id="title">SnakeGFFI</div>
<div id="ui">
  Score: <span id="score">0</span> |
  High: <span id="high">0</span>
</div>

<canvas id="game" width="320" height="320"></canvas>

<div class="controls">
  <div></div>
  <button onclick="setDir('up')">⬆️</button>
  <div></div>
  <button onclick="setDir('left')">⬅️</button>
  <button onclick="setDir('down')">⬇️</button>
  <button onclick="setDir('right')">➡️</button>
</div>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");
const box = 16;
const size = 320;

let snake = [{x:160,y:160}];
let dir = "right";
let food = spawnFood();
let score = 0;
let speed = 130;
let snakeColor = randomNeon();

let high = localStorage.getItem("snakeHigh") || 0;
document.getElementById("high").innerText = high;

function randomNeon(){
  const colors = ["#0f0","#0ff","#f0f","#ff0","#f00"];
  return colors[Math.floor(Math.random()*colors.length)];
}

function spawnFood(){
  return {
    x: Math.floor(Math.random()*20)*box,
    y: Math.floor(Math.random()*20)*box
  }
}

function setDir(d){
  if(d==="left" && dir!=="right") dir=d;
  if(d==="right" && dir!=="left") dir=d;
  if(d==="up" && dir!=="down") dir=d;
  if(d==="down" && dir!=="up") dir=d;
}

function drawPortal(x,y){
  ctx.strokeStyle="#0ff";
  ctx.shadowColor="#0ff";
  ctx.shadowBlur=10;
  ctx.beginPath();
  ctx.arc(x+box/2,y+box/2,10,0,Math.PI*2);
  ctx.stroke();
}

function draw(){
  ctx.clearRect(0,0,size,size);

  // food
  ctx.shadowBlur=8;
  ctx.shadowColor="red";
  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,box,box);

  // snake
  ctx.shadowColor=snakeColor;
  ctx.shadowBlur=8;
  snake.forEach((s,i)=>{
    ctx.fillStyle = i===0 ? "#fff" : snakeColor;
    ctx.fillRect(s.x,s.y,box,box);

    // 👀 mata di kepala
    if(i===0){
      ctx.fillStyle="black";
      ctx.fillRect(s.x+4,s.y+4,3,3);
      ctx.fillRect(s.x+9,s.y+4,3,3);
    }
  });

  let head={...snake[0]};
  if(dir==="left") head.x-=box;
  if(dir==="right") head.x+=box;
  if(dir==="up") head.y-=box;
  if(dir==="down") head.y+=box;

  // 🌀 portal tembus tembok
  if(head.x<0){ drawPortal(0,head.y); head.x=size-box; }
  if(head.x>=size){ drawPortal(size-box,head.y); head.x=0; }
  if(head.y<0){ drawPortal(head.x,0); head.y=size-box; }
  if(head.y>=size){ drawPortal(head.x,size-box); head.y=0; }

  // tabrak badan
  if(snake.some(s=>s.x===head.x && s.y===head.y)){
    alert("Game Over\nScore: "+score);
    location.reload();
  }

  snake.unshift(head);

  if(head.x===food.x && head.y===food.y){
    score++;
    snakeColor = randomNeon(); // 🌈 ganti warna
    document.getElementById("score").innerText=score;
    if(score>high){
      high=score;
      localStorage.setItem("snakeHigh",high);
      document.getElementById("high").innerText=high;
    }
    food=spawnFood();
    if(speed>60) speed-=5;
    clearInterval(loop);
    loop=setInterval(draw,speed);
  }else{
    snake.pop();
  }
}

let loop=setInterval(draw,speed);
</script>
</body>
</html>
