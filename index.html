<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cinematic Love</title>
<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#000;
  touch-action:none;
}
canvas{
  display:block;
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
resize();
window.addEventListener("resize",resize);

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}

const particles = [];
const bgStars = [];
const COUNT = innerWidth < 600 ? 900 : 1400;
let phase = 0;
let timer = 0;
let targetPoints = [];

class Particle{
  constructor(){
    this.reset();
  }
  reset(){
    this.x = Math.random()*canvas.width;
    this.y = Math.random()*canvas.height;
    this.vx = 0;
    this.vy = 0;
    this.tx = this.x;
    this.ty = this.y;
    this.size = Math.random()<0.08 ? 2.2 : 1.2;
    this.glow = Math.random()<0.08;
    this.color = `hsl(${Math.random()*360},100%,70%)`;
  }
  update(){
    this.x += (this.tx - this.x)*0.05;
    this.y += (this.ty - this.y)*0.05;
  }
  draw(){
    ctx.beginPath();
    ctx.fillStyle = this.color;
    if(this.glow){
      ctx.shadowBlur = 12;
      ctx.shadowColor = this.color;
    }
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

class Star{
  constructor(){
    this.x = Math.random()*canvas.width;
    this.y = Math.random()*canvas.height;
    this.z = Math.random()*1+0.2;
  }
  update(){
    this.y += this.z*0.2;
    if(this.y>canvas.height){
      this.y=0;
      this.x=Math.random()*canvas.width;
    }
  }
  draw(){
    ctx.fillStyle="rgba(255,255,255,0.15)";
    ctx.fillRect(this.x,this.y,1.2,1.2);
  }
}

for(let i=0;i<COUNT;i++)particles.push(new Particle());
for(let i=0;i<120;i++)bgStars.push(new Star());

function textPoints(text){
  const off = document.createElement("canvas");
  off.width = canvas.width;
  off.height = canvas.height;
  const octx = off.getContext("2d");
  octx.fillStyle="#fff";
  octx.font=`bold ${canvas.width<600?70:110}px Arial`;
  octx.textAlign="center";
  octx.textBaseline="middle";
  octx.fillText(text,canvas.width/2,canvas.height/2);

  const img=octx.getImageData(0,0,off.width,off.height).data;
  const pts=[];
  for(let y=0;y<off.height;y+=4){
    for(let x=0;x<off.width;x+=4){
      if(img[(y*off.width+x)*4+3]>150){
        pts.push({x,y});
      }
    }
  }
  return pts;
}

function heartPoints(){
  const pts=[];
  const cx=canvas.width/2;
  const cy=canvas.height/2;
  const s=canvas.width<600?9:12;
  for(let t=0;t<Math.PI*2;t+=0.02){
    const x=16*Math.pow(Math.sin(t),3);
    const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    pts.push({x:cx+x*s,y:cy+y*s});
  }
  return pts;
}

function assign(points){
  targetPoints = points;
  particles.forEach((p,i)=>{
    const pt = targetPoints[i % targetPoints.length];
    p.tx = pt.x;
    p.ty = pt.y;
  });
}

function scatter(){
  particles.forEach(p=>{
    p.tx = Math.random()*canvas.width;
    p.ty = Math.random()*canvas.height;
  });
}

function sequence(){
  if(timer===0)assign(heartPoints());
  if(timer===240){ scatter(); }
  if(timer===380){ assign(textPoints("I LOVE YOU")); }
  if(timer===620){ scatter(); }
  if(timer===760){ assign(textPoints("DEA")); }
  if(timer>1050) timer=0;
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  bgStars.forEach(s=>{s.update();s.draw();});

  sequence();
  particles.forEach(p=>{
    p.update();
    p.draw();
  });

  timer++;
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
