<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SnakeGFFI Smooth</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
  font-family:Orbitron, Arial;
}

#title{
  position:absolute;
  top:10px;
  font-size:28px;
  text-align:center;
  width:100%;
  color:#0f0;
  text-shadow:0 0 10px #0f0,0 0 20px #0f0;
}

#ui{
  position:absolute;
  top:50px;
  width:100%;
  text-align:center;
  color:#0f0;
  font-size:16px;
}

canvas{
  background:#050505;
  box-shadow:0 0 20px #0f0;
  touch-action:none;
}

.controls{
  position:absolute;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  display:grid;
  grid-template-columns:60px 60px 60px;
  grid-template-rows:60px 60px;
  gap:6px;
}
.controls button{
  background:#111;
  border:2px solid #0f0;
  color:#0f0;
  font-size:22px;
  border-radius:10px;
  box-shadow:0 0 8px #0f0;
}

#runBtn{
  position:absolute;
  bottom:25px;
  right:20px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#0f0;
  color:#000;
  font-weight:bold;
  font-size:18px;
  text-align:center;
  line-height:60px;
  user-select:none;
  touch-action:none;
  box-shadow:0 0 10px #0f0;
}
</style>
</head>
<body>

<div id="title">SnakeGFFI</div>
<div id="ui">
  Score: <span id="score">0</span> | High: <span id="high">0</span>
</div>

<canvas id="game" width="320" height="320"></canvas>

<div class="controls">
  <div></div>
  <button onclick="setDir('up')">⬆️</button>
  <div></div>
  <button onclick="setDir('left')">⬅️</button>
  <button onclick="setDir('down')">⬇️</button>
  <button onclick="setDir('right')">➡️</button>
</div>
<div id="runBtn">RUN</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const box = 16;
const size = 320;

let snake = [{x:160,y:160}];
let targetDir = {x:1, y:0}; // arah yang dituju
let dir = {x:1, y:0};       // arah saat ini
let food = spawnFood();
let score = 0;
let baseSpeed = 300; // ms per kotak
let runActive = false;
let snakeColor = randomNeon();
let titleColors = ["#0f0","#0ff","#f0f","#ff0","#f00"];
let titleIndex = 0;
let high = localStorage.getItem("snakeHigh")||0;
document.getElementById("high").innerText = high;

function randomNeon(){const colors=["#0f0","#0ff","#f0f","#ff0","#f00"];return colors[Math.floor(Math.random()*colors.length)];}
function spawnFood(){return {x: Math.floor(Math.random()*20)*box, y: Math.floor(Math.random()*20)*box};}

function setDir(d){
  if(d==="left" && targetDir.x!==1){targetDir={x:-1,y:0};}
  if(d==="right" && targetDir.x!==-1){targetDir={x:1,y:0};}
  if(d==="up" && targetDir.y!==1){targetDir={x:0,y:-1};}
  if(d==="down" && targetDir.y!==-1){targetDir={x:0,y:1};}
}

// run button
let runBtn = document.getElementById("runBtn");
runBtn.addEventListener("touchstart",()=>{runActive=true;});
runBtn.addEventListener("touchend",()=>{runActive=false;});

// portal
function drawPortal(x,y){
  ctx.strokeStyle="#0ff";
  ctx.shadowColor="#0ff";
  ctx.shadowBlur=10;
  ctx.beginPath();
  ctx.arc(x+box/2,y+box/2,10,0,Math.PI*2);
  ctx.stroke();
}

// move snake smooth
let lastTime = 0;
let moveProgress = 0;
function gameLoop(time){
  if(!lastTime) lastTime=time;
  let delta = time - lastTime;
  lastTime = time;

  // smooth lerp arah
  dir.x = targetDir.x;
  dir.y = targetDir.y;

  moveProgress += delta;
  let interval = runActive? baseSpeed/2 : baseSpeed;

  if(moveProgress >= interval){
    moveProgress=0;

    let head={x:snake[0].x + dir.x*box, y:snake[0].y + dir.y*box};

    // portal
    if(head.x<0){ drawPortal(0,head.y); head.x=size-box;}
    if(head.x>=size){ drawPortal(size-box,head.y); head.x=0;}
    if(head.y<0){ drawPortal(head.x,0); head.y=size-box;}
    if(head.y>=size){ drawPortal(head.x,size-box); head.y=0;}

    // collision safe
    if(snake.slice(1).some(s=>s.x===head.x && s.y===head.y)){
      alert("Game Over\nScore: "+score);
      location.reload();
    }

    snake.unshift(head);

    // eat food
    if(head.x===food.x && head.y===food.y){
      score++;
      snakeColor=randomNeon();
      document.getElementById("score").innerText=score;
      if(score>high){high=score; localStorage.setItem("snakeHigh",high); document.getElementById("high").innerText=high;}
      food=spawnFood();
    }else{
      snake.pop();
    }
  }

  draw();
  requestAnimationFrame(gameLoop);
}

// draw
function draw(){
  ctx.clearRect(0,0,size,size);

  // title neon
  titleIndex=(titleIndex+1)%titleColors.length;
  document.getElementById("title").style.color=titleColors[titleIndex];

  // draw food
  ctx.shadowBlur=8;
  ctx.shadowColor="red";
  ctx.fillStyle="red";
  ctx.fillRect(food.x,food.y,box,box);

  // draw snake
  ctx.shadowBlur=8;
  ctx.shadowColor=snakeColor;
  snake.forEach((s,i)=>{
    ctx.fillStyle=i===0?"#fff":snakeColor;
    ctx.fillRect(s.x,s.y,box,box);
    if(i===0){
      ctx.fillStyle="black";
      ctx.fillRect(s.x+4,s.y+4,3,3);
      ctx.fillRect(s.x+9,s.y+4,3,3);
    }
  });
}

// start loop
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
