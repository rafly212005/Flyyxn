<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>GFFI — Free Fire Indonesia</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Share+Tech+Mono&display=swap');

/* ─── RESET ─── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#04020a;font-family:'Share Tech Mono',monospace;}

/* ═══════════════════════════════════════
   BACKGROUND — 100% CSS, zero JS
   Only animates: opacity & transform (GPU composited)
═══════════════════════════════════════ */

/* Deep space base */
.bg{
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 120% 80% at 50% 110%, #1a0500 0%, transparent 55%),
    radial-gradient(ellipse 80% 60% at 20% 20%, #0a003a 0%, transparent 50%),
    radial-gradient(ellipse 60% 50% at 80% 80%, #1a0008 0%, transparent 50%),
    linear-gradient(160deg, #04020c 0%, #080318 40%, #04020a 100%);
  z-index:0;
}

/* Animated glow orbs — opacity only = GPU */
.glow{position:fixed;border-radius:50%;z-index:0;pointer-events:none;filter:blur(60px);}
.glow1{
  width:50vw;height:50vw;
  top:60%;left:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,70,0,.12) 0%,transparent 70%);
  animation:glowPulse 4s ease-in-out infinite;
}
.glow2{
  width:40vw;height:40vw;
  top:20%;left:15%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(100,0,200,.08) 0%,transparent 70%);
  animation:glowPulse 6s ease-in-out infinite reverse;
}
.glow3{
  width:35vw;height:35vw;
  top:30%;right:5%;transform:translateY(-50%);
  background:radial-gradient(circle,rgba(255,140,0,.07) 0%,transparent 70%);
  animation:glowPulse 5s ease-in-out 1s infinite;
}
@keyframes glowPulse{0%,100%{opacity:.6}50%{opacity:1}}

/* Grid — CSS background, scrolls via transform */
.grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,90,0,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,90,0,.045) 1px,transparent 1px);
  background-size:48px 48px;
  animation:gridScroll 10s linear infinite;
  will-change:transform;
}
@keyframes gridScroll{0%{transform:translateY(0)}100%{transform:translateY(48px)}}

/* Perspective floor grid */
.floor{
  position:fixed;bottom:-10%;left:-20%;right:-20%;height:55%;z-index:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(90deg,rgba(255,80,0,.06) 0,rgba(255,80,0,.06) 1px,transparent 1px,transparent 7%),
    repeating-linear-gradient(rgba(255,80,0,.05) 0,rgba(255,80,0,.05) 1px,transparent 1px,transparent 10%);
  transform:perspective(280px) rotateX(65deg);
  transform-origin:50% 100%;
  mask-image:linear-gradient(to top,rgba(0,0,0,.5) 0%,transparent 100%);
  -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.5) 0%,transparent 100%);
}

/* Vignette */
.vig{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 90% 90% at 50% 50%,transparent 40%,rgba(2,1,8,.85) 100%);
}

/* Scan line — single element, transform only */
.scan{
  position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;
}
.scan::after{
  content:'';position:absolute;left:0;right:0;
  height:120px;
  background:linear-gradient(180deg,transparent 0%,rgba(255,80,0,.04) 50%,transparent 100%);
  animation:scanMove 5s linear infinite;
  will-change:transform;
}
@keyframes scanMove{0%{transform:translateY(-120px)}100%{transform:translateY(100vh)}}

/* Horizontal accent lines */
.hline{position:fixed;left:0;right:0;height:1px;z-index:2;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,100,0,.35),rgba(255,200,0,.6),rgba(255,100,0,.35),transparent);animation:hlinePulse 3s ease-in-out infinite;}
.hline.t{top:0}.hline.b{bottom:0;animation-delay:1.5s}
@keyframes hlinePulse{0%,100%{opacity:.3}50%{opacity:1}}

/* ═══════════════════════════════════════
   LOADER CONTENT
═══════════════════════════════════════ */
#loader{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 1.4s ease,transform 1.4s ease;
}
#loader.exit{opacity:0;transform:scale(1.03);pointer-events:none;}

/* Corner HUD labels */
.hud{position:absolute;font-size:.5rem;letter-spacing:.1em;color:rgba(255,140,0,.38);line-height:2.1;}
.hud.tl{top:18px;left:18px}
.hud.tr{top:18px;right:18px;text-align:right}
.hud.bl{bottom:18px;left:18px}
.hud.br{bottom:18px;right:18px;text-align:right}

/* HUD brackets */
.hb{position:absolute;width:20px;height:20px;animation:hbPulse 3.5s ease-in-out infinite;}
.hb.tl{top:10px;left:10px;border-top:1.5px solid rgba(255,130,0,.5);border-left:1.5px solid rgba(255,130,0,.5);}
.hb.tr{top:10px;right:10px;border-top:1.5px solid rgba(255,130,0,.5);border-right:1.5px solid rgba(255,130,0,.5);}
.hb.bl{bottom:10px;left:10px;border-bottom:1.5px solid rgba(255,130,0,.5);border-left:1.5px solid rgba(255,130,0,.5);}
.hb.br{bottom:10px;right:10px;border-bottom:1.5px solid rgba(255,130,0,.5);border-right:1.5px solid rgba(255,130,0,.5);}
@keyframes hbPulse{0%,100%{opacity:.3}50%{opacity:.9}}

/* ─── EMBLEM ─── */
.emblem{
  position:relative;
  width:clamp(130px,26vw,190px);
  height:clamp(130px,26vw,190px);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:clamp(18px,3.5vw,32px);
}

/* Rings — ONLY transform animated */
.ring{position:absolute;border-radius:50%;will-change:transform;}
.r1{
  inset:0;border:1px solid rgba(255,140,0,.18);
  animation:rCW 16s linear infinite;
}
.r1::before,.r1::after{
  content:'';position:absolute;border-radius:50%;
  width:5px;height:5px;top:-2.5px;left:50%;
  transform:translateX(-50%);
  background:#ff8800;
  box-shadow:0 0 8px #ff8800,0 0 18px #ff4500;
}
.r1::after{top:auto;bottom:-2.5px;background:#ffcc00;box-shadow:0 0 8px #ffcc00;}
.r2{
  inset:14%;border:1px solid rgba(255,60,0,.22);
  animation:rCCW 10s linear infinite;
}
.r2::before{
  content:'';position:absolute;border-radius:50%;
  width:4px;height:4px;top:-2px;left:50%;
  transform:translateX(-50%);
  background:#ff4500;box-shadow:0 0 8px #ff4500;
}
.r3{
  inset:28%;border:1px dashed rgba(255,200,0,.2);
  animation:rCW 7s linear infinite;
}
@keyframes rCW{to{transform:rotate(360deg)}}
@keyframes rCCW{to{transform:rotate(-360deg)}}

/* Core hex */
.core{
  width:clamp(64px,13vw,96px);
  height:clamp(64px,13vw,96px);
  position:relative;z-index:5;
  display:flex;align-items:center;justify-content:center;
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  background:radial-gradient(circle at 40% 30%,#2a0f00,#140700,#05030a);
  animation:corePulse 3s ease-in-out infinite;
  will-change:opacity;
}
@keyframes corePulse{
  0%,100%{box-shadow:0 0 0 0 transparent}
  50%{box-shadow:0 0 40px 10px rgba(255,100,0,.25)}
}

/* Flame */
.flame{width:50%;height:58%;position:relative;z-index:6;filter:drop-shadow(0 0 4px #ff8800) drop-shadow(0 0 10px #ff4500);animation:flameP 2.2s ease-in-out infinite;will-change:transform;}
@keyframes flameP{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.08) translateY(-2px)}}

/* ─── TITLE ─── */
.title{
  font-family:'Teko',sans-serif;font-weight:700;
  font-size:clamp(3rem,12vw,5.8rem);
  letter-spacing:.2em;color:#fff;line-height:1;
  text-shadow:0 0 18px #ff8800,0 0 45px rgba(255,120,0,.35),0 0 1px rgba(255,255,255,.5);
  animation:titleFlick 9s ease-in-out infinite;
  will-change:opacity;
}
@keyframes titleFlick{0%,86%,90%,100%{opacity:1}88%{opacity:.55}89%{opacity:.95}}

.subtitle{
  font-size:clamp(.52rem,2vw,.72rem);
  letter-spacing:.45em;color:#ff8800;
  text-transform:uppercase;opacity:.7;
  margin-top:4px;margin-bottom:2px;
  text-align:center;
}

/* Divider */
.divider{
  width:min(380px,76vw);height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,140,0,.15),#ff8800,rgba(255,140,0,.15),transparent);
  margin:clamp(8px,1.8vw,14px) 0;
  position:relative;display:flex;align-items:center;justify-content:space-between;
}
.divider::before,.divider::after{
  content:'';width:3px;height:3px;border-radius:50%;
  background:#ff8800;box-shadow:0 0 6px #ff8800;
  position:absolute;top:50%;transform:translateY(-50%);
}
.divider::before{left:0}.divider::after{right:0}

/* ─── LOADING TEXT ─── */
.lt-box{height:24px;display:flex;align-items:center;justify-content:center;margin-bottom:clamp(14px,2.5vw,24px);}
.lt{
  font-size:clamp(.62rem,1.9vw,.76rem);letter-spacing:.22em;
  color:#ff8800;text-shadow:0 0 7px #ff8800;
  opacity:0;transition:opacity .3s ease;
  display:flex;align-items:center;gap:8px;
}
.lt.on{opacity:1}
.lt::before{content:'▶';font-size:.42rem;color:#ff4500;animation:cur .85s step-end infinite;}
@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}

/* ─── PROGRESS ─── */
.pg{width:min(380px,76vw);}
.pg-top{display:flex;justify-content:space-between;font-size:.52rem;letter-spacing:.12em;color:rgba(255,140,0,.4);margin-bottom:6px;}
.pg-track{height:2px;background:rgba(255,60,0,.1);border-radius:2px;position:relative;overflow:visible;}
.pg-bar{
  height:100%;border-radius:2px;
  background:linear-gradient(90deg,#ff3300,#ff8800,#ffcc00,#ff8800,#ff3300);
  background-size:400% 100%;
  box-shadow:0 0 10px #ff8800,0 0 22px rgba(255,140,0,.28);
  width:0%;transition:width .22s ease;
  will-change:width;
  animation:pgShift 2s linear infinite;
}
.pg-bar::after{
  content:'';position:absolute;
  right:-1px;top:-5px;
  width:2px;height:12px;
  background:#fff;border-radius:1px;
  box-shadow:0 0 6px #fff,0 0 14px #ffcc00;
}
@keyframes pgShift{0%{background-position:0 0}100%{background-position:400% 0}}

/* ─── STATS ─── */
.stats{display:flex;justify-content:center;gap:clamp(10px,3.5vw,32px);margin-top:clamp(10px,2vw,18px);}
.stat{text-align:center;}
.sv{
  font-family:'Teko',sans-serif;font-weight:700;
  font-size:clamp(.9rem,2.6vw,1.25rem);
  color:#ffcc00;text-shadow:0 0 8px #ffcc00;
  display:block;line-height:1.1;
}
.sl{font-size:.46rem;letter-spacing:.14em;color:rgba(255,140,0,.42);text-transform:uppercase;}

/* ═══════════════════════════════════════
   SITE FRAME
═══════════════════════════════════════ */
#site{
  position:fixed;inset:0;z-index:5;
  opacity:0;pointer-events:none;
  transition:opacity 1.2s ease .3s;
}
#site.on{opacity:1;pointer-events:all;}
#site iframe{width:100%;height:100%;border:none;display:block;}

/* Mobile */
@media(max-width:360px){.hud{display:none;}.hb{width:14px;height:14px;}}
</style>
</head>
<body>

<!-- BACKGROUND LAYERS — all CSS, GPU only -->
<div class="bg"></div>
<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="glow glow3"></div>
<div class="grid"></div>
<div class="floor"></div>
<div class="vig"></div>
<div class="scan"></div>
<div class="hline t"></div>
<div class="hline b"></div>

<!-- LOADER -->
<div id="loader">

  <!-- HUD corners -->
  <div class="hb tl"></div><div class="hb tr"></div>
  <div class="hb bl"></div><div class="hb br"></div>
  <div class="hud tl">GFFI v3.1<br>SRV: ID-MAIN<br>PING: <span id="pg-ping">—</span>ms</div>
  <div class="hud tr">REGION: ID<br>MODE: RANKED<br>SLOT: <span id="pg-slot">—</span>/50</div>
  <div class="hud bl">© GFFI COMMUNITY<br>FREE FIRE INDONESIA</div>
  <div class="hud br">EXP: <span id="pg-exp">—</span><br>RANK: <span id="pg-rank">—</span></div>

  <!-- Emblem -->
  <div class="emblem">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="core">
      <svg class="flame" viewBox="0 0 60 76" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M30 3C30 3 48 21 48 37c0 10-5 16-11 20 3-7 0-14-4-17 0 7-4 12-7 17C20 53 14 47 14 37 14 21 30 3 30 3z" fill="url(#f1)"/>
        <path d="M30 25s8 10 8 20c0 6-3 9-5 11 1-4 0-9-3-12 0 5-2 8-5 12-3-3-4-6-4-11 0-10 9-20 9-20z" fill="url(#f2)"/>
        <path d="M25 60Q30 73 35 60Q32 65 30 67Q28 65 25 60Z" fill="url(#f1)" opacity=".65"/>
        <defs>
          <linearGradient id="f1" x1="30" y1="3" x2="30" y2="73" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffd700"/>
            <stop offset="55%" stop-color="#ff8800"/>
            <stop offset="100%" stop-color="#ff3300"/>
          </linearGradient>
          <linearGradient id="f2" x1="30" y1="25" x2="30" y2="63" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fffacc"/>
            <stop offset="55%" stop-color="#ffd700"/>
            <stop offset="100%" stop-color="#ff8800"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
  </div>

  <!-- Title -->
  <div class="title">GFFI</div>
  <div class="subtitle">Garena Free Fire Indonesia</div>

  <div class="divider"></div>

  <!-- Loading text -->
  <div class="lt-box">
    <div class="lt on" id="lt-txt">Menginisialisasi sistem…</div>
  </div>

  <!-- Progress -->
  <div class="pg">
    <div class="pg-top"><span>BATTLE SYSTEM INIT</span><span id="pg-pct">0%</span></div>
    <div class="pg-track"><div class="pg-bar" id="pg-fill"></div></div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat"><span class="sv" id="st-map">—</span><span class="sl">MAP LOADED</span></div>
    <div class="stat"><span class="sv" id="st-ply">—</span><span class="sl">PEMAIN AKTIF</span></div>
    <div class="stat"><span class="sv" id="st-sts">—</span><span class="sl">STATUS</span></div>
  </div>

</div>

<!-- SITE -->
<div id="site">
  <iframe src="https://garena-freefire-indonesia.netlify.app/" title="GFFI" loading="lazy"></iframe>
</div>

<script>
// ── LOADING TEXTS ──
const TEXTS = [
  "Menginisialisasi sistem…",
  "Terhubung ke server GFFI…",
  "Memuat data pejuang…",
  "Mengaktifkan battle royale…",
  "Sinkronisasi rank & EXP…",
  "Rendering peta Bermuda…",
  "Memuat mode komunitas…",
  "Verifikasi identitas pemain…",
  "Dunia digital siap tempur…",
  "⚡ SURVIVE OR DIE — GFFI ONLINE!"
];

// Non-linear steps
const STEPS = [4,6,3,9,5,11,4,13,5,7,5,4,4,3,3,2,2,1,1,1];

let prog = 0, ti = 0, si = 0;

const fill  = document.getElementById('pg-fill');
const pct   = document.getElementById('pg-pct');
const ltxt  = document.getElementById('lt-txt');
const stMap = document.getElementById('st-map');
const stPly = document.getElementById('st-ply');
const stSts = document.getElementById('st-sts');
const elPing = document.getElementById('pg-ping');
const elSlot = document.getElementById('pg-slot');
const elExp  = document.getElementById('pg-exp');
const elRank = document.getElementById('pg-rank');

function setText(t) {
  ltxt.classList.remove('on');
  setTimeout(() => { ltxt.textContent = t; ltxt.classList.add('on'); }, 280);
}

function updateStats() {
  const p = prog;
  stMap.textContent = Math.floor(p * .6);
  stPly.textContent = Math.floor(p * 3.5);
  elPing.textContent = 7 + Math.floor(Math.random() * 14);
  elSlot.textContent = Math.floor(p * .47);
  elExp.textContent  = Math.floor(p * 44);
  elRank.textContent = p < 25 ? 'INIT' : p < 55 ? 'SYNC' : p < 88 ? 'READY' : 'ONLINE';
  stSts.textContent  = p < 100 ? 'LOADING' : 'ONLINE';
}

function tick() {
  if (prog >= 100) { done(); return; }
  prog = Math.min(100, prog + STEPS[si % STEPS.length]);
  si++;
  fill.style.width = prog + '%';
  pct.textContent  = Math.round(prog) + '%';
  const ni = Math.floor((prog / 100) * (TEXTS.length - 1));
  if (ni !== ti) { ti = ni; setText(TEXTS[ti]); }
  updateStats();
  setTimeout(tick, 110 + Math.random() * 350);
}

function done() {
  setText("⚡ Selamat datang, Pejuang GFFI!");
  stSts.textContent = 'ONLINE';
  setTimeout(() => {
    document.getElementById('loader').classList.add('exit');
    document.getElementById('site').classList.add('on');
  }, 900);
}

setTimeout(tick, 550);
</script>
</body>
</html>
