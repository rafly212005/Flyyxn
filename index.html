<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GFFI SOS 3x3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap');

body {
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-family:'Orbitron',sans-serif;
  background: radial-gradient(circle at center,#0a0a0a,#000022 90%);
  overflow:hidden;
  color:white;
}

canvas#bg {
  position: fixed;
  top: 0; left:0;
  width:100%; height:100%;
  z-index:-1;
}

h1 {
  font-size:48px;
  color:#0ff;
  text-shadow:0 0 10px #0ff,0 0 20px #0ff;
  margin-bottom:20px;
}

#gbk, #letter-select {
  margin-bottom:15px;
}

#gbk button, #letter-select button {
  font-size:22px;
  margin:0 10px;
  padding:10px 20px;
  border:2px solid #0ff;
  border-radius:10px;
  background:transparent;
  color:#0ff;
  cursor:pointer;
  transition:0.2s;
  text-shadow:0 0 5px #0ff;
}

#gbk button:hover, #letter-select button:hover {
  background:#0ff;
  color:#000;
  box-shadow:0 0 15px #0ff;
}

#board {
  display:grid;
  grid-template-columns: repeat(3, 100px);
  grid-template-rows: repeat(3, 100px);
  gap:10px;
  position:relative;
  margin-top:15px;
}

.cell {
  width:100px;
  height:100px;
  background:#111;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:40px;
  color:#0ff;
  cursor:pointer;
  box-shadow:0 0 10px #0ff inset,0 0 15px #0ff;
  transition: all 0.2s;
}

.cell:hover {
  transform:scale(1.1);
  box-shadow:0 0 20px #0ff inset,0 0 25px #0ff;
}

#message {
  margin-top:20px;
  font-size:20px;
  text-shadow:0 0 10px #0ff;
}

.line {
  position:absolute;
  height:6px;
  background:lime;
  transform-origin:left center;
  z-index:5;
  border-radius:3px;
}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<h1>GFFI SOS 3x3</h1>

<div id="gbk">
  Pilih Gunting ✂️, Batu 🪨, atau Kertas 📄:<br>
  <button onclick="chooseGBK('G')">Gunting</button>
  <button onclick="chooseGBK('B')">Batu</button>
  <button onclick="chooseGBK('K')">Kertas</button>
</div>

<div id="letter-select" style="display:none;">
  Pilih huruf: 
  <button onclick="chooseLetter('S')">S</button>
  <button onclick="chooseLetter('O')">O</button>
</div>

<div id="board"></div>
<div id="message">Tentukan siapa mulai dulu!</div>

<script>
const boardSize=3;
let board=Array(boardSize).fill(null).map(()=>Array(boardSize).fill(''));
let playerLetter='S';
let playerTurn=false;
let gameOver=false;
const boardEl=document.getElementById('board');
const messageEl=document.getElementById('message');
const gbkEl=document.getElementById('gbk');
const letterEl=document.getElementById('letter-select');

// Gunting-Batu-Kertas
function chooseGBK(playerChoice){
  const options=['G','B','K'];
  const botChoice=options[Math.floor(Math.random()*3)];
  let result='';
  if(playerChoice===botChoice) result='Seri! Ulang GBK!';
  else if(
    (playerChoice==='G' && botChoice==='K')||
    (playerChoice==='B' && botChoice==='G')||
    (playerChoice==='K' && botChoice==='B')
  ) { result='Kamu mulai dulu!'; playerTurn=true; }
  else { result='Bot mulai dulu!'; playerTurn=false; setTimeout(botMove,600);}
  messageEl.textContent=`Pilihanmu:${playerChoice}, Bot:${botChoice}. ${result}`;
  if(result!=='Seri! Ulang GBK!'){
    gbkEl.style.display='none';
    letterEl.style.display='block';
  }
}

// Pilih huruf S/O
function chooseLetter(letter){ playerLetter=letter; messageEl.textContent=`Giliranmu: huruf ${letter}`; }

function renderBoard(){
  boardEl.innerHTML='';
  for(let i=0;i<boardSize;i++){
    for(let j=0;j<boardSize;j++){
      const cell=document.createElement('div');
      cell.classList.add('cell');
      cell.textContent=board[i][j];
      cell.addEventListener('click',()=>playerMove(i,j));
      boardEl.appendChild(cell);
    }
  }
}

// Cek SOS
function checkSOS(){
  const lines=[];
  for(let i=0;i<boardSize;i++){
    for(let j=0;j<=boardSize-3;j++) if(board[i][j]+board[i][j+1]+board[i][j+2]==='SOS') lines.push([[i,j],[i,j+2]]);
  }
  for(let j=0;j<boardSize;j++){
    for(let i=0;i<=boardSize-3;i++) if(board[i][j]+board[i+1][j]+board[i+2][j]==='SOS') lines.push([[i,j],[i+2,j]]);
  }
  for(let i=0;i<=boardSize-3;i++){
    for(let j=0;j<=boardSize-3;j++) if(board[i][j]+board[i+1][j+1]+board[i+2][j+2]==='SOS') lines.push([[i,j],[i+2,j+2]]);
  }
  for(let i=0;i<=boardSize-3;i++){
    for(let j=2;j<boardSize;j++) if(board[i][j]+board[i+1][j-1]+board[i+2][j-2]==='SOS') lines.push([[i,j],[i+2,j-2]]);
  }
  return lines;
}

// Garis animasi neon
function drawLine(start,end,color){
  const line=document.createElement('div');
  line.classList.add('line');
  line.style.background=color;
  const size=100+10;
  const x1=start[1]*size+50;
  const y1=start[0]*size+50;
  const x2=end[1]*size+50;
  const y2=end[0]*size+50;
  const dx=x2-x1,dy=y2-y1;
  const length=Math.sqrt(dx*dx+dy*dy);
  const angle=Math.atan2(dy,dx)*180/Math.PI;
  line.style.width='0px';
  line.style.left=x1+'px';
  line.style.top=y1+'px';
  line.style.transform=`rotate(${angle}deg)`;
  boardEl.appendChild(line);
  let progress=0;
  const anim=setInterval(()=>{
    progress+=5;
    if(progress>=length){ line.style.width=length+'px'; clearInterval(anim);}
    else line.style.width=progress+'px';
  },10);
}

// Player move
function playerMove(r,c){
  if(gameOver||!playerTurn||board[r][c]!=='') return;
  board[r][c]=playerLetter;
  renderBoard();
  const sos=checkSOS();
  if(sos.length>0){ drawLine(sos[0][0],sos[0][1],'lime'); return endGame('Kamu menang!'); }
  if(board.flat().every(cell=>cell!=='')&&!checkSOS().length){ return restartGBK('Seri! GBK lagi'); }
  playerTurn=false;
  messageEl.textContent='Giliran Bot...';
  setTimeout(botMove,500);
}

// Bot pintar: blok/bikin SOS
function botMove(){
  if(gameOver) return;
  let move=null;
  outer: for(let i=0;i<boardSize;i++){
    for(let j=0;j<boardSize;j++){
      if(board[i][j]===''){
        board[i][j]='S';
        if(checkSOS().length>0){ move=[i,j,'S']; board[i][j]=''; break outer;}
        board[i][j]='O';
        if(checkSOS().length>0){ move=[i,j,'O']; board[i][j]=''; break outer;}
        board[i][j]='';
      }
    }
  }
  if(!move){
    const empty=[];
    for(let i=0;i<boardSize;i++) for(let j=0;j<boardSize;j++) if(board[i][j]==='') empty.push([i,j]);
    const m=empty[Math.floor(Math.random()*empty.length)];
    move=[m[0],m[1],Math.random()<0.5?'S':'O'];
  }
  board[move[0]][move[1]]=move[2];
  renderBoard();
  const sos=checkSOS();
  if(sos.length>0){ drawLine(sos[0][0],sos[0][1],'red'); return endGame('Bot menang!'); }
  if(board.flat().every(cell=>cell!=='')&&!checkSOS().length){ return restartGBK('Seri! GBK lagi'); }
  playerTurn=true;
  messageEl.textContent='Giliranmu: pilih huruf dan klik kotak!';
}

function restartGBK(msg){
  messageEl.textContent=msg;
  board=Array(boardSize).fill(null).map(()=>Array(boardSize).fill(''));
  renderBoard();
  gameOver=false;
  gbkEl.style.display='block';
  letterEl.style.display='none';
}

function endGame(msg){ messageEl.textContent=msg; gameOver=true; }

renderBoard();

// Background partikel alam semesta
const canvas=document.getElementById('bg');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth; canvas.height=window.innerHeight;
const particles=[];
for(let i=0;i<200;i++){
  particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2+1,dx:(Math.random()-0.5)*0.5,dy:(Math.random()-0.5)*0.5,color:`hsl(${Math.random()*360},100%,80%)`});
}
function animate(){
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let p of particles){
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color; ctx.fill();
    p.x+=p.dx; p.y+=p.dy;
    if(p.x<0)p.x=canvas.width; if(p.x>canvas.width)p.x=0;
    if(p.y<0)p.y=canvas.height; if(p.y>canvas.height)p.y=0;
  }
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
