<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GFFI Loading</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
  font-family:Arial, sans-serif;
}
canvas{position:fixed;inset:0}

/* ===== LOADER ===== */
#loader{
  position:fixed;
  bottom:64px;
  width:100%;
  text-align:center;
  color:white;
  z-index:10;
}
#status{
  font-size:clamp(14px,4vw,22px);
  letter-spacing:3px;
  margin-bottom:12px;
}
#barBox{
  width:78vw;
  max-width:420px;
  height:14px;
  border:1px solid rgba(255,255,255,.4);
  margin:auto;
  overflow:hidden;
}
#bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,red,blue,green);
  box-shadow:0 0 18px rgba(0,255,255,.6);
}
#flash{
  position:fixed;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
  z-index:99;
}
</style>
</head>
<body>

<script>
/* ===== CEGAH LOADING ULANG ===== */
if(sessionStorage.getItem("gffi_loaded")){
  location.replace("https://webgffi000.netlify.app/");
}
</script>

<div id="loader">
  <div id="status">LOADING</div>
  <div id="barBox"><div id="bar"></div></div>
</div>

<div id="flash"></div>
<canvas id="c"></canvas>

<script>
/* ===== CANVAS ===== */
const c=document.getElementById("c");
const ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();addEventListener("resize",resize);

const SCALE=Math.min(innerWidth,innerHeight)/800;

/* ===== PARTICLES ===== */
const particles=[];
const COUNT=innerWidth<600?600:900;
let speed=.006;
let mode="warp";
let targets=[];

for(let i=0;i<COUNT;i++){
  particles.push({
    x:(Math.random()-.5)*2,
    y:(Math.random()-.5)*2,
    z:Math.random(),
    tx:0, ty:0
  });
}

/* ===== TEXT TARGET ===== */
function makeText(txt){
  const off=document.createElement("canvas");
  off.width=c.width;
  off.height=c.height;
  const o=off.getContext("2d");

  o.clearRect(0,0,off.width,off.height);
  o.font=`bold ${120*SCALE}px Arial`;
  o.textAlign="center";
  o.textBaseline="middle";
  o.fillStyle="white";
  o.fillText(txt,off.width/2,off.height/2);

  const d=o.getImageData(0,0,off.width,off.height).data;
  targets=[];
  for(let y=0;y<off.height;y+=6){
    for(let x=0;x<off.width;x+=6){
      if(d[(y*off.width+x)*4]>200){
        targets.push({x,y});
      }
    }
  }
}

/* ===== DRAW ===== */
function draw(){
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.fillRect(0,0,c.width,c.height);

  const cx=c.width/2, cy=c.height/2;

  particles.forEach((p,i)=>{
    let x,y;
    if(mode==="warp"){
      p.z-=speed;
      if(p.z<=0) p.z=1;
      x=cx+p.x*(1/p.z)*420*SCALE;
      y=cy+p.y*(1/p.z)*420*SCALE;
    }else{
      const t=targets[i%targets.length];
      p.x+=(t.x-p.x)*.06;
      p.y+=(t.y-p.y)*.06;
      x=p.x; y=p.y;
    }
    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(x,y,1.6*SCALE,0,Math.PI*2);
    ctx.fill();
  });

  requestAnimationFrame(draw);
}
draw();

/* ===== LOADING 8–12 DETIK (STABIL) ===== */
const bar=document.getElementById("bar");
const status=document.getElementById("status");

const DURATION=(8+Math.random()*4)*1000;
const start=performance.now();

function loading(now){
  const t=now-start;
  const p=Math.min(100,(t/DURATION)*100);
  bar.style.width=p+"%";
  speed=.006+(p/100)*.03;
  if(t<DURATION) requestAnimationFrame(loading);
}
requestAnimationFrame(loading);

/* ===== TIMELINE ===== */
setTimeout(()=>{mode="text";makeText("GFFI")},DURATION*.25);
setTimeout(()=>{makeText("FLYYXN")},DURATION*.5);
setTimeout(()=>{mode="warp"},DURATION*.7);

setTimeout(()=>{
  status.innerText="MASUK";
  const f=document.getElementById("flash");
  f.style.transition="opacity .25s";
  f.style.opacity=1;

  setTimeout(()=>{
    sessionStorage.setItem("gffi_loaded","true");
    location.replace("https://webgffi000.netlify.app/");
  },300);
},DURATION);
</script>

</body>
</html>
