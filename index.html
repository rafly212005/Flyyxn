<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart to Name</title>
<style>
*{margin:0;padding:0;overflow:hidden}
body{background:#000;font-family:Arial}
canvas{display:block}

#overlay{
 position:fixed;
 inset:0;
 background:#000;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 z-index:10;
}
#overlay input{
 padding:12px 18px;
 font-size:18px;
 border-radius:30px;
 border:none;
 outline:none;
 text-align:center;
 margin-bottom:12px;
}
#overlay button{
 padding:10px 22px;
 border-radius:30px;
 border:none;
 font-size:16px;
 cursor:pointer;
}
</style>
</head>
<body>

<div id="overlay">
 <input id="nameInput" placeholder="Masukkan nama">
 <button onclick="start()">Mulai</button>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d",{alpha:false});
canvas.width = innerWidth;
canvas.height = innerHeight;

let centerX = canvas.width/2;
let centerY = canvas.height/2;

let username = "";
let phase = "heart";
let phaseTime = 0;
let time = 0;

class Particle{
 constructor(x,y,tx=null,ty=null,h=0){
  this.x=x; this.y=y;
  this.tx=tx; this.ty=ty;
  this.vx=(Math.random()-0.5)*6;
  this.vy=(Math.random()-0.5)*6;
  this.h=h;
 }
 update(){
  if(this.tx!==null){
   this.vx+=(this.tx-this.x)*0.01;
   this.vy+=(this.ty-this.y)*0.01;
   this.vx*=0.85; this.vy*=0.85;
  }
  this.x+=this.vx; this.y+=this.vy;
 }
 draw(){
  ctx.fillStyle=`hsl(${this.h},100%,60%)`;
  ctx.shadowBlur=10;
  ctx.shadowColor=`hsl(${this.h},100%,50%)`;
  ctx.beginPath();
  ctx.arc(this.x,this.y,2,0,Math.PI*2);
  ctx.fill();
 }
}

class Trail{
 constructor(){this.p=[];this.max=40;}
 add(x,y,h){
  this.p.push({x,y,h});
  if(this.p.length>this.max)this.p.shift();
 }
 draw(){
  for(let i=1;i<this.p.length;i++){
   const a=i/this.p.length;
   ctx.globalAlpha=a;
   ctx.strokeStyle=`hsl(${this.p[i].h},100%,60%)`;
   ctx.lineWidth=2*a;
   ctx.shadowBlur=15;
   ctx.beginPath();
   ctx.moveTo(this.p[i-1].x,this.p[i-1].y);
   ctx.lineTo(this.p[i].x,this.p[i].y);
   ctx.stroke();
  }
 }
}

function heartShape(t,s=1){
 return{
  x:s*16*Math.pow(Math.sin(t),3),
  y:-s*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))
 };
}

const trails=[];
for(let i=0;i<8;i++)trails.push(new Trail());
const particles=[];
let textTargets=[];

function buildText(){
 const off=document.createElement("canvas");
 const o=off.getContext("2d");
 off.width=canvas.width;
 off.height=canvas.height;
 o.fillStyle="#fff";
 o.font="bold 140px Arial";
 o.textAlign="center";
 o.textBaseline="middle";
 o.fillText(username,centerX,centerY);
 const d=o.getImageData(0,0,off.width,off.height).data;
 textTargets=[];
 for(let y=0;y<off.height;y+=6){
  for(let x=0;x<off.width;x+=6){
   if(d[(y*off.width+x)*4]>200){
    textTargets.push({x,y});
   }
  }
 }
 particles.length=0;
 textTargets.forEach(p=>{
  particles.push(new Particle(
   Math.random()*canvas.width,
   Math.random()*canvas.height,
   p.x,p.y,
   Math.random()*360
  ));
 });
}

function animate(){
 ctx.fillStyle="rgba(0,0,0,0.15)";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 if(phase==="heart"){
  time+=0.06;
  trails.forEach((t,i)=>{
   const off=i/8*Math.PI*2;
   const pos=heartShape(time+off,7);
   const h=(time*80+i*25)%360;
   t.add(centerX+pos.x,centerY+pos.y,h);
   t.draw();
   if(Math.random()<0.12){
    particles.push(new Particle(
     centerX+pos.x,centerY+pos.y,null,null,h
    ));
   }
  });
  if(++phaseTime>300){phase="explode";phaseTime=0;}
 }

 else if(phase==="explode"){
  particles.forEach(p=>{
   p.vx*=1.05; p.vy*=1.05;
   p.update(); p.draw();
  });
  if(++phaseTime>120){
   phase="text";
   buildText();
  }
 }

 else{
  particles.forEach(p=>{p.update();p.draw();});
 }

 requestAnimationFrame(animate);
}

function start(){
 const v=document.getElementById("nameInput").value.trim();
 if(!v)return;
 username=v;
 document.getElementById("overlay").style.display="none";
 animate();
}

addEventListener("resize",()=>{
 canvas.width=innerWidth;
 canvas.height=innerHeight;
 centerX=canvas.width/2;
 centerY=canvas.height/2;
});
</script>
</body>
</html>
