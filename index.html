<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>GFFI Loading</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
  font-family:Arial, sans-serif;
}
canvas{position:fixed;inset:0}

/* LOADER */
#loader{
  position:absolute;
  bottom:50px;
  width:100%;
  text-align:center;
  z-index:10;
  color:white;
}
#status{
  font-size:22px;
  letter-spacing:4px;
  margin-bottom:12px;
}

/* BAR */
#barBox{
  width:260px;
  height:10px;
  border:1px solid rgba(255,255,255,.4);
  margin:auto;
  overflow:hidden;
}
#bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,red,blue,green);
  transition:width .2s;
}

/* FLASH */
#flash{
  position:fixed;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
  z-index:99;
}
</style>
</head>
<body>

<script>
if(sessionStorage.getItem("gffi_loaded")){
  location.replace("https://webbbgffi.netlify.app/");
}
</script>

<div id="loader">
  <div id="status">LOADING</div>
  <div id="barBox"><div id="bar"></div></div>
</div>

<div id="flash"></div>
<canvas id="c"></canvas>

<script>
const c=document.getElementById("c");
const ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();onresize=resize;

/* ========= PARTIKEL ========= */
const warp=[], stars=[];
const WARP_MAX=900, STAR_MAX=160;
let speed=.006;

function spawnWarp(p){
  p.x=(Math.random()-.5)*2;
  p.y=(Math.random()-.5)*2;
  p.z=Math.random();
}
for(let i=0;i<WARP_MAX;i++){const p={};spawnWarp(p);warp.push(p)}

for(let i=0;i<STAR_MAX;i++){
  stars.push({
    x:Math.random()*c.width,
    y:Math.random()*c.height,
    r:Math.random()*1.5+.3,
    a:Math.random()
  });
}

function draw(){
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.fillRect(0,0,c.width,c.height);

  /* STAR GLOW */
  stars.forEach(s=>{
    s.a+=Math.random()*.05;
    ctx.fillStyle=`rgba(255,255,255,${.2+Math.sin(s.a)*.4})`;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });

  /* WARP */
  const cx=c.width/2, cy=c.height/2;
  warp.forEach(p=>{
    p.z-=speed;
    if(p.z<=0) spawnWarp(p);

    const x=cx+p.x*(1/p.z)*420;
    const y=cy+p.y*(1/p.z)*420;
    const s=(1/p.z)*1.6;

    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(x,y,s,0,Math.PI*2);
    ctx.fill();
  });

  requestAnimationFrame(draw);
}
draw();

/* ========= LOADING ========= */
let progress=0;
const bar=document.getElementById("bar");
const status=document.getElementById("status");

function load(){
  if(progress>=100) return;
  let j=progress<60?Math.random()*7:Math.random()*2;
  progress=Math.min(100,progress+j|0);
  bar.style.width=progress+"%";
  speed=.006+(progress/100)*.03;
  setTimeout(load,120+Math.random()*250);
}
load();

/* ========= TIMELINE ========= */
const total=(8+Math.random()*4)*1000;

setTimeout(()=>status.innerText="LOGIN KE GFFI",total*.4);
setTimeout(()=>status.innerText="MASUK",total*.75);

setTimeout(()=>{
  const f=document.getElementById("flash");
  f.style.transition="opacity .25s";
  f.style.opacity=1;
  setTimeout(()=>{
    sessionStorage.setItem("gffi_loaded","true");
    location.replace("https://webbbgffi.netlify.app/");
  },300);
},total);
</script>

</body>
</html>
